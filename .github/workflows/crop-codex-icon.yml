name: Crop Codex icon

on:
  push:
    branches:
      - fix/ci-baseline
    paths:
      - .github/workflows/crop-codex-icon.yml

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-baseline

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick pngcheck

      - name: Trim transparent padding
        run: |
          set -euo pipefail
          icon=modules/desktop/gnome/icons/codex.png
          tmp="$(mktemp --suffix=.png)"
          convert "$icon" -trim +repage PNG32:"$tmp"
          mv "$tmp" "$icon"
          identify "$icon"
          pngcheck "$icon"

      - name: Commit cropped icon
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/desktop/gnome/icons/codex.png
          if git diff --cached --quiet; then
            echo "Icon already tightly cropped"
            exit 0
          fi
          git commit -m "fix(icons): crop codex icon"
          git push origin HEAD:fix/ci-baseline
