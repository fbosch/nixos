[project]
name = "nixos"
revision = "1.0"

[providers]
common = "sops://secrets/common.yaml"
apis = "sops://secrets/apis.yaml"
systemd = "systemd-credential://"

[profiles.default]
GITHUB_TOKEN = { description = "GitHub access token", providers = ["common"], ref = { item = "github-token" } }
COPILOT_TOKEN = { description = "GitHub Copilot token", providers = ["common"], ref = { item = "github-token" } }
CONTEXT7_API_KEY = { description = "Context7 API key", providers = ["apis"], ref = { item = "context7-api-key" } }
KAGI_API_TOKEN = { description = "Kagi API token", providers = ["apis"], ref = { item = "kagi-api-token" } }
OPENAI_API_KEY = { description = "OpenAI API key", providers = ["apis"], ref = { item = "openai-api-key" } }
EXA_API_KEY = { description = "Exa API key", providers = ["apis"], ref = { item = "exa-api-key" } }
RD_API_TOKEN = { description = "Real-Debrid API token", providers = ["apis"], ref = { item = "rd-api-token" } }
MORPH_API_KEY = { description = "Morph API key", providers = ["apis"], ref = { item = "morph-api-key" } }

[profiles.systemd]
WAKAPI_PASSWORD_SALT = { description = "Wakapi password salt", providers = ["systemd"] }

[scopes.github]
secrets = ["GITHUB_TOKEN", "COPILOT_TOKEN"]

[scopes.ai]
secrets = ["CONTEXT7_API_KEY", "KAGI_API_TOKEN", "OPENAI_API_KEY", "EXA_API_KEY", "MORPH_API_KEY"]

[scopes.downloads]
secrets = ["RD_API_TOKEN"]

[scopes.wakapi]
secrets = ["WAKAPI_PASSWORD_SALT"]
